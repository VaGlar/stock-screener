name: Weekly Stock Screener

on:
  schedule:
    # Κάθε Δευτέρα στις 07:00 ώρα Ελλάδας (04:00 UTC)
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas requests numpy
    

      - name: Step 1 — Build dynamic watchlist from Finviz
        run: python build_watchlist.py

      - name: Step 2 — Run screener on watchlist
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python screener.py
