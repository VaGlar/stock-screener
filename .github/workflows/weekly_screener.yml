name: Weekly Stock Screener

on:
  schedule:
    # Κάθε Δευτέρα στις 07:00 ώρα Ελλάδας (04:00 UTC)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas requests numpy lxml html5lib

      - name: Step 1 — Build dynamic watchlist from Finviz
        run: python build_watchlist.py

      - name: Upload watchlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: watchlist.json
          retention-days: 7

      - name: Step 2 — Run screener on watchlist
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python screener.py

      - name: Commit updated recommendations log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendations_log.csv
          git diff --staged --quiet || git commit -m "Update recommendations log"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
