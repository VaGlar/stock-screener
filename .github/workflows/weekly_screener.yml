name: Weekly Stock Screener

on:
  schedule:
    # Κάθε Δευτέρα στις 08:00 ώρα Ελλάδας (06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Επιτρέπει και χειροκίνητη εκτέλεση από το GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run screener
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python screener.py
