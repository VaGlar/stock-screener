name: Debug Wikipedia Tables

on:
  workflow_dispatch:  # Μόνο χειροκίνητα

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas lxml html5lib

      - name: Debug Wikipedia table structure
        run: |
          python3 << 'EOF'
          import pandas as pd
          import urllib.request
          import io

          HEADERS = {"User-Agent": "Mozilla/5.0"}

          URLS = {
              "FTSE100": "https://en.wikipedia.org/wiki/FTSE_100",
              "DAX": "https://en.wikipedia.org/wiki/DAX",
              "CAC40": "https://en.wikipedia.org/wiki/CAC_40",
              "Eurostoxx50": "https://en.wikipedia.org/wiki/Euro_Stoxx_50",
              "ASX200": "https://en.wikipedia.org/wiki/S%26P/ASX_200",
              "HangSeng": "https://en.wikipedia.org/wiki/Hang_Seng_Index",
              "Nikkei225": "https://en.wikipedia.org/wiki/Nikkei_225",
              "BSESensex": "https://en.wikipedia.org/wiki/BSE_SENSEX",
              "TAIEX": "https://en.wikipedia.org/wiki/TAIEX",
              "TaiwanFTSE50": "https://en.wikipedia.org/wiki/FTSE_TWSE_Taiwan_50_Index",
              "KOSPI": "https://en.wikipedia.org/wiki/KOSPI",
              "KOSPI200": "https://en.wikipedia.org/wiki/KOSPI_200",
          }

          def trunc(v, n=60):
              s = str(v)
              return s if len(s) <= n else s[:n] + "…"

          with open("wiki_debug_output.txt", "w") as out:
              for name, url in URLS.items():
                  out.write(f"\n{'='*50}\n{name}\n{'='*50}\n")
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          html = resp.read().decode("utf-8")
                      tables = pd.read_html(io.StringIO(html))
                      out.write(f"Total tables: {len(tables)}\n")
                      for i, t in enumerate(tables):
                          cols = list(t.columns)[:6]
                          sample = [trunc(v) for v in t.iloc[0].tolist()[:3]] if len(t) > 0 else []
                          out.write(f"  Table {i} ({len(t)} rows): cols={cols}\n")
                          out.write(f"    Sample row: {sample}\n")
                  except Exception as e:
                      out.write(f"ERROR: {e}\n")
          EOF

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: wiki-debug-output
          path: wiki_debug_output.txt
          retention-days: 7
