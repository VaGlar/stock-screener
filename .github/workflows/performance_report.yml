name: Performance Report

on:
  schedule:
    # 1η κάθε μήνα, 07:00 ώρα Ελλάδας (04:00 UTC)
    - cron: "0 4 1 * *"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"  # χωρίς αυτό, το stdout είναι block-buffered και τα logs εμφανίζονται εκτός σειράς

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Run performance report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python performance_report.py

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance_report.csv
          retention-days: 90
